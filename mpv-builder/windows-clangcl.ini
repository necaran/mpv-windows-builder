[binaries]
mt = ['mt.exe']
ar = ['llvm-lib.exe']
windres = ['llvm-rc.exe']
c = ['clang-cl.exe']
c_ld = ['lld-link.exe']
cpp = ['clang-cl.exe']
cpp_ld = ['lld-link.exe']

[build_machine]
endian = 'little'
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
[host_machine]
endian = 'little'
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'


[built-in options]
werror = false

c_args = ['/utf-8', '/MT', '/Zi', '-flto=thin', '-fuse-ld=lld']
cpp_args = ['/utf-8', '/MT', '/Zi', '-flto=thin', '-fuse-ld=lld']

c_link_args = ['ksuser.lib', '-MANIFEST:NO']
cpp_link_args = ['ksuser.lib', '-MANIFEST:NO']
